services:
  searxng:
    image: docker.io/searxng/searxng:latest
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8888/
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set a local random SEARXNG_SECRET before starting}
      SEARXNG_SETTINGS_PATH: /opt/detot/settings.yml
    volumes:
      - ./settings.yml:/opt/detot/settings.yml:ro
      - searxng-cache:/var/cache/searxng

volumes:
  searxng-cache:
